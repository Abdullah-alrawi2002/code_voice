[project]
name = "backend"
version = "0.1.0"
description = "Televic voice support intake and case management backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.27.0",
    "openai>=2.53.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "websockets>=17.0.0,<18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
